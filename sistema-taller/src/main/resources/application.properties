# Nombre que Spring mostrara al iniciar la aplicacion.
spring.application.name=sistema-taller

# Puerto HTTP utilizado por el servidor integrado.
server.port=8081

# Base de datos H2 en memoria (los datos se pierden al apagar la app).
spring.datasource.url=jdbc:h2:mem:taller
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA crea y actualiza las tablas automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 para inspeccionar las tablas.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
