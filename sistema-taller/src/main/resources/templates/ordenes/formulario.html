<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Orden</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}">Inicio</a>
    <a th:href="@{/clientes}">Clientes</a>
    <a th:href="@{/vehiculos}">Vehiculos</a>
    <a th:href="@{/mecanicos}">Mecanicos</a>
    <a th:href="@{/ordenes}">Ordenes</a>
</nav>
<div class="container">
    <div class="card">
        <h1 th:text="${titulo}">Orden</h1>
        <form th:action="@{/ordenes/guardar}" th:object="${orden}" method="post">
            <input type="hidden" th:field="*{id}">
            <label>Vehiculo</label>
            <select th:field="*{vehiculoId}" required>
                <option value="">Seleccione un vehiculo</option>
                <option th:each="v : ${vehiculos}"
                        th:value="${v.id}"
                        th:text="${v.placa + ' - ' + v.marca + ' ' + v.modelo}"></option>
            </select>
            <label>Mecanico</label>
            <select th:field="*{mecanicoId}" required>
                <option value="">Seleccione un mecanico</option>
                <option th:each="m : ${mecanicos}"
                        th:value="${m.id}"
                        th:text="${m.nombre + ' (' + m.especialidad + ')'}"></option>
            </select>
            <label>Descripcion</label>
            <textarea th:field="*{descripcion}" rows="3" required></textarea>
            <label>Costo</label>
            <input type="number" step="0.01" th:field="*{costo}" required>
            <p style="margin-top:1rem;" class="actions">
                <button class="btn" type="submit">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/ordenes}">Cancelar</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
