<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}">Inicio</a>
    <a th:href="@{/clientes}">Clientes</a>
    <a th:href="@{/vehiculos}">Vehiculos</a>
    <a th:href="@{/mecanicos}">Mecanicos</a>
    <a th:href="@{/ordenes}">Ordenes</a>
</nav>
<div class="container">
    <div th:if="${mensaje}" class="alert alert-ok" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="toolbar">
        <h1>Clientes</h1>
        <a class="btn" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Telefono</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.telefono}"></td>
            <td th:text="${c.correo}"></td>
            <td class="actions">
                <a class="btn btn-secondary btn-small" th:href="@{/clientes/editar/{id}(id=${c.id})}">Editar</a>
                <a class="btn btn-danger btn-small" th:href="@{/clientes/eliminar/{id}(id=${c.id})}"
                   onclick="return confirm('Eliminar este cliente?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
